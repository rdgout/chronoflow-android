<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change an answer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/chronoflow/components/bundle.css">
<script src="ds/chronoflow/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Figtree';src:url("/_blob/74876cc764ebb15bf4ae98bcdbf3140c") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/741b1ce40b46479a73d934d0d5be9774") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/079d83fda74d66d1f31e35072f71201d") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/991830890debdac04981f1a27656ed5c") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url("/_blob/fc815083784d00806d267d81858d2414") format("woff2");font-weight:400 500;font-style:normal;font-display:swap}
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 375px; height: 812px; overflow: hidden; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
  <div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden;">
    <dc-import name="TripReview" theme="{{theme}}" hint-size="375px,812px"></dc-import>
  </div>
  <a href="TripReview.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: oklch(0.15 0.03 272 / 0.5);"></a>
  <section role="dialog" aria-modal="true" aria-labelledby="ra-title" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 14px; padding: 12px 20px 32px; border-radius: 38px 38px 0 0; background: var(--card); color: var(--card-foreground); box-shadow: var(--shadow-soft);">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 9999px; background: rgba(120, 120, 128, 0.4);"></span>
    <p style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dawn-text);">Health · caffeine</p>
    <h2 id="ra-title" style="margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 32px; letter-spacing: -0.01em;">Have you been told to avoid caffeine?</h2>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--muted-foreground);">Why this matters: without an answer, we leave coffee out of your plan.</p>
    <div role="radiogroup" aria-labelledby="ra-title" style="display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
        <x-import component-from-global-scope="ChronoFlow.ChoiceCard" title="{{o.title}}" hint="{{o.hint}}" selected="{{o.selected}}" on-select="{{o.pick}}"></x-import>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--muted-foreground);">Changing this recalculates your plan when you save the review. Check-offs are kept.</p>
    <div style="display: grid; gap: 6px;">
      <a href="TripReviewUpdate.dc.html" class="inline-flex shrink-0 items-center justify-center gap-2 text-sm font-medium whitespace-nowrap transition-colors rounded-full bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-6" style="height: 48px; text-decoration: none;">Save answer</a>
      <a href="TripReview.dc.html" class="inline-flex shrink-0 items-center justify-center gap-2 text-sm font-medium whitespace-nowrap transition-colors rounded-full hover:bg-accent hover:text-accent-foreground h-10 px-6" style="height: 44px; color: var(--foreground); text-decoration: none;">Cancel</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { v: 'yes' }; }
  renderVals() {
    const defs = [['no', 'No', 'Coffee and tea are part of your plan'], ['yes', 'Yes', 'We leave caffeine out of your plan']];
    return { theme: this.props.theme ?? 'light', opts: defs.map(([id, title, hint]) => ({ title, hint, selected: this.state.v === id, pick: () => this.setState({ v: id }) })) };
  }
}
</script>
</body>
</html>
