<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Privacy policy</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/chronoflow/components/bundle.css">
<script src="ds/chronoflow/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Figtree';src:url("/_blob/74876cc764ebb15bf4ae98bcdbf3140c") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/741b1ce40b46479a73d934d0d5be9774") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/079d83fda74d66d1f31e35072f71201d") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/991830890debdac04981f1a27656ed5c") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url("/_blob/fc815083784d00806d267d81858d2414") format("woff2");font-weight:400 500;font-style:normal;font-display:swap}
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 375px; height: 812px; overflow: hidden; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
  <div style="position: absolute; inset: 0; overflow-y: auto;">
    <header class="ios ios-navbar">
      <span><a href="SetData.dc.html" class="ios ios-glass ios-back"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>Your data</a></span>
      <span></span>
      <span></span>
    </header>

    <main style="padding: 4px 16px 40px; display: flex; flex-direction: column; gap: 20px;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h1 class="ios-largetitle">Privacy policy</h1>
        <div style="display: flex; flex-wrap: wrap; gap: 6px;">
          <x-import component-from-global-scope="ChronoFlow.MetaChip">Version 2.4</x-import>
          <x-import component-from-global-scope="ChronoFlow.MetaChip">Accepted 2 Sep 2026</x-import>
        </div>
      </div>

      <nav aria-label="On this page" style="display: flex; flex-direction: column; padding: 6px 0; border-radius: 22px; border: 1px solid var(--border); background: var(--card);">
        <sc-for list="{{sections}}" as="s" hint-placeholder-count="6">
          <a href="{{s.href}}" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; font-size: 14px; line-height: 20px; color: var(--foreground); text-decoration: none;"><span style="width: 24px; color: var(--muted-foreground); font-variant-numeric: tabular-nums;">{{s.n}}</span>{{s.title}}</a>
        </sc-for>
      </nav>

      <sc-for list="{{sections}}" as="s" hint-placeholder-count="6">
        <section id="{{s.id}}" style="display: flex; flex-direction: column; gap: 6px;">
          <h2 style="margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; line-height: 28px; letter-spacing: -0.01em;">{{s.n}}. {{s.title}}</h2>
          <p style="margin: 0; font-size: 16px; line-height: 26px; color: var(--muted-foreground);">[Policy text from your legal team]</p>
        </section>
      </sc-for>

      <div style="display: grid;">
        <x-import component-from-global-scope="ChronoFlow.Button" variant="outline" size="lg">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>
          Open on the web
        </x-import>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    const titles = ['What we collect', 'Why we use it', 'Your health answers', 'How long we keep it', 'Your rights', 'How to reach us'];
    return {
      theme: this.props.theme ?? 'light',
      sections: titles.map((title, i) => ({ n: i + 1, title, id: 'p' + (i + 1), href: '#p' + (i + 1) }))
    };
  }
}
</script>
</body>
</html>
