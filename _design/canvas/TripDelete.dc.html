<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delete trip confirmation</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/chronoflow/components/bundle.css">
<script src="ds/chronoflow/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Figtree';src:url("/_blob/74876cc764ebb15bf4ae98bcdbf3140c") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/741b1ce40b46479a73d934d0d5be9774") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/079d83fda74d66d1f31e35072f71201d") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/991830890debdac04981f1a27656ed5c") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url("/_blob/fc815083784d00806d267d81858d2414") format("woff2");font-weight:400 500;font-style:normal;font-display:swap}
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">
  <div aria-hidden="true" style="position: absolute; inset: 0;">
    <dc-import name="Plan" theme="{{theme}}" hint-size="390px,844px"></dc-import>
  </div>
  <a href="Plan.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.2);"></a>

  <div style="position: absolute; inset: 0; display: grid; place-items: center; padding: 0 24px;">
    <section role="alertdialog" aria-modal="true" aria-labelledby="td-title" class="ios ios-glass ios-alert" style="background: color-mix(in oklab, var(--card) 82%, transparent);">
      <h2 id="td-title">Delete Amsterdam → Tokyo?</h2>
      <p>The trip, both plans and your check-offs are deleted on all your devices. This can't be undone.</p>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px;"><a href="Plan.dc.html" class="ios-alert-btn">Keep trip</a><a href="Trips.dc.html" class="ios-alert-btn" data-role="destructive">Delete trip</a></div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
