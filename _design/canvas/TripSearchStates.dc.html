</head>
<body>

<helmet>
<style>
@font-face{font-family:'Figtree';src:url("/_blob/74876cc764ebb15bf4ae98bcdbf3140c") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/741b1ce40b46479a73d934d0d5be9774") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url("/_blob/079d83fda74d66d1f31e35072f71201d") format("woff2");font-weight:600;font-style:normal;font-display:swap}

body{margin:0}

<div data-theme="{{theme}}" style="width: 375px; height: 1400px; box-sizing: border-box; overflow: hidden; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px; background: var(--background); color: var(--foreground); font-family: var(--font-sans);">

  <section style="display: flex; flex-direction: column; gap: 12px;">
    <h2 style="margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted-foreground);">Fewer than 2 characters</h2>
    <x-import component-from-global-scope="ChronoFlow.Card">
      <x-import component-from-global-scope="ChronoFlow.Field" id="q1" type="search" label="Search airports" default-value="D" hint="Type at least 2 letters to search."></x-import>
    </x-import>
  </section>

  <section style="display: flex; flex-direction: column; gap: 12px;">
    <h2 style="margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted-foreground);">Searching</h2>
    <x-import component-from-global-scope="ChronoFlow.Card">
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <x-import component-from-global-scope="ChronoFlow.Field" id="q2" type="search" label="Search airports" default-value="Dub"></x-import>
        <p role="status" style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: var(--muted-foreground);">
          <svg class="animate-spin" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
          Searching airports…
        </p>
        <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 10px;">
          <div style="width: 100%; height: 48px; border-radius: 14px; overflow: hidden;"><x-import component-from-global-scope="ChronoFlow.Skeleton" class-name="h-full w-full"></x-import></div>
          <div style="width: 100%; height: 48px; border-radius: 14px; overflow: hidden;"><x-import component-from-global-scope="ChronoFlow.Skeleton" class-name="h-full w-full"></x-import></div>
          <div style="width: 100%; height: 48px; border-radius: 14px; overflow: hidden;"><x-import component-from-global-scope="ChronoFlow.Skeleton" class-name="h-full w-full"></x-import></div>
        </div>
      </div>
    </x-import>
  </section>

  <section style="display: flex; flex-direction: column; gap: 12px;">
    <h2 style="margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted-foreground);">No results</h2>
    <x-import component-from-global-scope="ChronoFlow.Card">
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <x-import component-from-global-scope="ChronoFlow.Field" id="q3" type="search" label="Search airports" default-value="Tokio Nrita"></x-import>
        <div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px 12px; border-radius: 22px; border: 2px dashed var(--border); text-align: center;">
          <p style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600;">No airports found</p>
          <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--muted-foreground);">Try the city name, like “Tokyo”, or the 3-letter code on your ticket, like “NRT”.</p>
        </div>
      </div>
    </x-import>
  </section>

  <section style="display: flex; flex-direction: column; gap: 12px;">
    <h2 style="margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted-foreground);">Error with retry</h2>
    <x-import component-from-global-scope="ChronoFlow.Card">
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <x-import component-from-global-scope="ChronoFlow.Field" id="q4" type="search" label="Search airports" default-value="Dub"></x-import>
        <div role="alert" style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 22px; border: 1px solid var(--border); background: var(--surface-2);">
          <p style="margin: 0; display: flex; align-items: flex-start; gap: 8px; font-size: 14px; line-height: 20px;">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px; color: var(--destructive);"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
            <span><span style="font-weight: 600;">We couldn't search airports.</span> Check your connection and try again.</span>
          </p>
          <div style="display: grid;"><x-import component-from-global-scope="ChronoFlow.Button" variant="outline" size="lg">Try again</x-import></div>
        </div>
      </div>
    </x-import>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":375,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>

</html>
