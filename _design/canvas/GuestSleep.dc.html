<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { chronotype: 'between' };
  }
  renderVals() {
    const types = [
      { id: 'early', title: 'Early bird', hint: 'Up early, tired in the evening' },
      { id: 'between', title: 'In between', hint: 'Your energy follows a normal working day.' },
      { id: 'owl', title: 'Night owl', hint: 'You come alive late and find early starts hard.' },
      { id: 'unsure', title: 'Not sure', hint: 'We use your sleep times instead.' }
    ];
    return {
      theme: this.props.theme ?? 'light',
      chronotypes: types.map((t) => ({ ...t, selected: this.state.chronotype === t.id, pick: () => this.setState({ chronotype: t.id }) }))
    };
  }
}
</script>
